title: BananaHackers
description: >-
  A rewrite of bananahackers.net on GitHub Pages
url: https://bananahackers.net
logo: "/assets/images/banana.png"
favicon_ico: "/assets/favicon.ico"

theme: just-the-docs
color_scheme: bananahackers_light

search_enabled: true
search:
  focus_shortcut_key: "k"

aux_links:
  Wiki: https://wiki.bananahackers.net
  BH App Store: https://store.bananahackers.net
  Google Forums: https://groups.google.com/g/bananahackers/
  Reddit: https://www.reddit.com/r/KaiOS
  Discord: https://discord.gg/rQ93zEu

aux_links_new_tab: true # Open auxiliary links in new tab instead of redirecting

nav_external_links:
  - title: W2D Jailbreak & Hotspot &nearr;
    url: http://w2d.js.org
    hide_icon: true
  - title: Back to old BananaHackers &nearr;
    url: https://ivan-hc.github.io/bananahackers
    hide_icon: true

back_to_top: true
back_to_top_text: "Back to top"

last_edit_timestamp: true
last_edit_time_format: "%e %B, %Y"

gh_edit_link: true
gh_edit_link_text: "View this page on GitHub &nearr;"
gh_edit_repository: "https://github.com/bananahackers/site"
gh_edit_branch: "main"
gh_edit_view_mode: tree

callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: yellow
  caution:
    title: Caution
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

defaults:
  - scope:
      path: ""
    values:
      layout: "default"